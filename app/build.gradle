plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.local.samsungalarmwidget'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'dev.local.samsungalarmwidget'
        minSdk 26
        targetSdk 36
        versionCode 100
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
